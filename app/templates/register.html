{% extends "base.html" %}

{% block title %}Register Account - TrustVault{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
  <div class="card">
    <div class="card-header" style="justify-content: center; text-align: center; flex-direction: column; gap: 0.5rem;">
      <h1 class="card-title" style="font-size: 1.5rem;">Create Account</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Register a new user identity and select security role.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. dave" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="dave@trustvault.local" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Strong password" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Assign Role</label>
        <select id="role" name="role" class="form-control" required>
          <option value="Viewer">Viewer (Read-Only access to shared documents)</option>
          <option value="Owner">Owner (Can upload, manage, share, and delete documents)</option>
          <option value="Admin">Admin (Access to immutable audit log stream and verification)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btn-register-submit">
        Complete Registration
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-dim);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent-cyan); text-decoration: none;">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
